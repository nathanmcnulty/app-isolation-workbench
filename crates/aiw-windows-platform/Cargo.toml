[package]
name = "aiw-windows-platform"
description = "Audited native Windows provider identity and readiness boundary for App Isolation Workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aiw-probe.workspace = true
aiw-provider-wsb.workspace = true
aiw-windows-command-line.workspace = true
hex.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Management_Deployment",
    "Storage",
    "Storage_Search",
    "System",
    "System_Profile",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_System_WinRT",
] }

# This crate is the sole WSB-specific native boundary. Unsafe blocks are kept
# small and audited around handle identity and catalog trust APIs.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
