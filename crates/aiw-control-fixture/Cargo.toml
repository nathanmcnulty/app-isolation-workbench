[package]
name = "aiw-control-fixture"
description = "Fixed local control fixture for App Isolation Workbench"
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
publish = false

[dependencies]
aiw-token = { path = "../aiw-token" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
