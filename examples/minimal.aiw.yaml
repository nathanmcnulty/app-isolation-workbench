schemaVersion: aiw.dev/v0alpha2
kind: AppIsolationProject

metadata:
  name: contoso-editor
  displayName: Contoso Editor isolation assessment
  owner: endpoint-engineering
  labels:
    purpose: windows-product-feedback
    dataClassification: test-only

application:
  type: exe
  path: inputs/ContosoEditorSetup.exe
  sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  expectedSigner: CN=Contoso Software, O=Contoso Software, C=US
  silentArguments:
    - /quiet
    - /norestart
  entryPoints:
    - id: main
      path: app/ContosoEditor.exe
  architecture: x64
  mayReboot: true
  updateUninstall:
    supportsUpdate: true
    supportsUninstall: true
    requiresReboot: true

isolationIntent:
  runtimeBoundary: processContainer
  network: blocked
  allowClipboard: false
  allowHostFileAccess: false
  allowHostRegistryAccess: false
  requireDescendantCoverage: true

executionProviders:
  - type: mxcProcessContainer
    id: mxc-process-container
    version: 0.1.0-preview
    executableSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    experimental: true

candidates:
  - id: win32-baseline
    type: unpackagedBaseline
    config:
      type: baseline
  - id: processcontainer-minimal
    type: processContainer
    experimental: true
    config:
      type: mxcProcessContainer
      provider_id: mxc-process-container
      requested_backend: appContainer
      network: blocked

scenarios:
  - id: first-run
    description: Launch the primary entry point and confirm the expected process.
    required: true
    steps:
      - type: install
      - type: launch
        entrypoint: main
      - type: waitForProcess
        image: ContosoEditor.exe
      - type: operatorCheckpoint
        prompt: Confirm that the main window rendered and basic navigation works.
      - type: gracefulClose

assertions:
  requireEffectiveBackendMatch: true
  requireTargetTokenEvidence: true
  requireExpectedChildCoverage: true
  requireOfflineCanaryDenied: true
  failOnEvidenceTruncation: true

analyst:
  enabled: false
  authority: advisoryOnly
  executionPlacement: host
  provider:
    id: foundryLocal
    mode: inProcess
    modelPack: aiw-evidence-analyst-small@1.0.0
    requireSignedPack: true
    allowCatalogDownload: false
  permissions:
    filesystem: none
    processExecution: none
    network: none
    packageMutation: none
    signing: none
    deployment: none
  requireEvidenceCitations: true
  proposalRequiresHumanApproval: true
