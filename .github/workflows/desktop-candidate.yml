name: Signed desktop candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a public alpha after the candidate and CI review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aiw-signed-desktop-candidate
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'nathanmcnulty/app-isolation-workbench' && github.ref == 'refs/heads/main' && github.actor == 'nathanmcnulty'
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      receipt: ${{ steps.build.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build unsigned desktop inputs without signing authority
        id: build
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PUBLISH_REQUESTED -ceq 'true' -and $env:REPOSITORY_PRIVATE -cne 'false') { throw 'Public publication requires the reviewed repository to be public first' }
          if ($env:ACTIONS_ID_TOKEN_REQUEST_URL -or $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) { throw 'Build unexpectedly has OIDC authority' }
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
          $guest = .\scripts\build-guest-agent.ps1 -Profile release | ConvertFrom-Json
          $root = Join-Path $env:RUNNER_TEMP 'aiw-unsigned-desktop'
          $package = .\scripts\build-desktop-package.ps1 -OutputDirectory $root -SourceRevision $env:SOURCE_REVISION -GuestAgent $guest.artifact -GuestAgentSha256 $guest.sha256 -KeepFailedBuild | ConvertFrom-Json
          $signing = Join-Path $env:RUNNER_TEMP 'aiw-signing-inputs'
          $binaries = Join-Path $signing 'binaries'
          New-Item -ItemType Directory -Path $binaries | Out-Null
          foreach ($name in @('aiw.exe', 'aiw-desktop.exe', 'verify-desktop-package.ps1')) { Copy-Item -LiteralPath (Join-Path $root $name) -Destination (Join-Path $binaries $name) }
          Copy-Item -LiteralPath (Join-Path $root 'product\notepad-plus-plus\tools\aiw-guest-agent.exe') -Destination (Join-Path $binaries 'aiw-guest-agent.exe')
          Copy-Item -LiteralPath scripts\desktop-package-archive.ps1 -Destination (Join-Path $binaries 'desktop-package-archive.ps1')
          $files = @(Get-ChildItem -LiteralPath $binaries -File | ForEach-Object { @{ name = $_.Name; sizeBytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          @{ sourceRevision = $env:SOURCE_REVISION; receiptSha256 = $package.receiptSha256; files = $files } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $signing 'unsigned-build.json')
          "receipt=$($package.receiptSha256)" >> $env:GITHUB_OUTPUT
      - name: Preserve unsigned assembly input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aiw-desktop-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}\aiw-unsigned-desktop/
          if-no-files-found: error
          retention-days: 7
      - name: Transfer only fixed signing inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aiw-desktop-signing-inputs-${{ github.sha }}
          path: ${{ runner.temp }}\aiw-signing-inputs/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    environment: artifact-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aiw-desktop-signing-inputs-${{ github.sha }}
          path: inputs
      - name: Check exact transferred inventory before Azure login
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
          RECEIPT: ${{ needs.build.outputs.receipt }}
          CLIENT_ID: ${{ vars.AIW_SIGNING_CLIENT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CLIENT_ID -notmatch '^[0-9a-f-]{36}$' -or $env:RECEIPT -notmatch '^[0-9a-f]{64}$') { throw 'Missing signing identity or receipt' }
          $expected = @('aiw.exe', 'aiw-desktop.exe', 'aiw-guest-agent.exe', 'verify-desktop-package.ps1', 'desktop-package-archive.ps1')
          $items = @(Get-ChildItem inputs -Recurse -Force)
          if ($items.Count -ne 7 -or @($items | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) { throw 'Unexpected signing input tree' }
          if ((Get-Item inputs\unsigned-build.json).Length -gt 16384) { throw 'Build record exceeds bound' }
          $build = Get-Content inputs\unsigned-build.json -Raw | ConvertFrom-Json
          if ($build.sourceRevision -cne $env:SOURCE_REVISION -or $build.receiptSha256 -cne $env:RECEIPT -or @($build.files).Count -ne 5) { throw 'Signing source or receipt mismatch' }
          foreach ($name in $expected) {
            $file = Get-Item -LiteralPath (Join-Path inputs\binaries $name)
            $records = @($build.files | Where-Object name -CEQ $name)
            if ($file.PSIsContainer -or $file.Length -gt 128MB -or $records.Count -ne 1 -or $records[0].sizeBytes -ne $file.Length -or $records[0].sha256 -cne (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Unsigned signing input differs' }
          }
      - name: Authenticate only the dedicated profile signer
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AIW_SIGNING_CLIENT_ID }}
          tenant-id: 847b5907-ca15-40f4-b171-eb18619dbfab
          subscription-id: a80941e8-c2b9-4bc9-83ad-117cc40d0bea
      - name: Sign the three executables and two handoff scripts
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: asa-nathanmcnulty
          certificate-profile-name: kvpp-public-trust
          files-folder: ${{ github.workspace }}\inputs\binaries
          files-folder-filter: exe,ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aiw-desktop-signed-inputs-${{ github.sha }}
          path: inputs/
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [build, sign]
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      handoff-inventory: ${{ steps.assemble.outputs.inventory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aiw-desktop-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}\unsigned-package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aiw-desktop-signed-inputs-${{ github.sha }}
          path: ${{ runner.temp }}\signed-inputs
      - name: Assemble and round-trip exact signed bytes without executing applications
        id: assemble
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
          RECEIPT: ${{ needs.build.outputs.receipt }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ACTIONS_ID_TOKEN_REQUEST_URL -or $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) { throw 'Assembly unexpectedly has OIDC authority' }
          $inputs = Join-Path $env:RUNNER_TEMP 'signed-inputs'
          $package = Join-Path $env:RUNNER_TEMP 'signed-package'
          $evidence = Join-Path $env:RUNNER_TEMP 'signed-evidence'
          $assembled = .\scripts\assemble-signed-desktop-package.ps1 -UnsignedPackageRoot (Join-Path $env:RUNNER_TEMP 'unsigned-package') -UnsignedReceiptSha256 $env:RECEIPT -SourceRevision $env:SOURCE_REVISION -SignedArtifactsDirectory (Join-Path $inputs 'binaries') -BuildRecord (Join-Path $inputs 'unsigned-build.json') -OutputDirectory $package -EvidenceDirectory $evidence | ConvertFrom-Json
          $handoff = Join-Path $env:RUNNER_TEMP 'desktop-handoff'
          & (Join-Path $inputs 'binaries\desktop-package-archive.ps1') -PackageRoot $package -OutputDirectory $handoff -ReceiptSha256 $assembled.receiptSha256 -SourceRevision $env:SOURCE_REVISION -RequirePublisherSignature | Out-Null
          $distribution = Get-Content (Join-Path $handoff 'distribution.json') -Raw | ConvertFrom-Json
          & (Join-Path $handoff 'desktop-package-archive.ps1') -ArchivePath (Join-Path $handoff 'aiw-desktop.zip') -ArchiveSha256 $distribution.archive.sha256 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'download-round-trip') -ReceiptSha256 $assembled.receiptSha256 -SourceRevision $env:SOURCE_REVISION -RequirePublisherSignature | Out-Null
          $guide = @'
          # App Isolation Workbench signed alpha candidate

          This candidate still needs runtime acceptance of these exact signed bytes.
          Run the following in PowerShell from this downloaded handoff folder.
          Compare the hashes below with the independently supplied CI/release record.
          Use a supported Windows 11 host with Windows Sandbox enabled; the GUI
          checks readiness before preparation.

          ```powershell
          $ErrorActionPreference = 'Stop'
          $expected = @{
              'desktop-package-archive.ps1' = '{HELPER_SHA}'
              'verify-desktop-package.ps1' = '{VERIFIER_SHA}'
          }
          foreach ($name in $expected.Keys) {
              if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected[$name]) { throw "Handoff hash mismatch: $name" }
              $signature = Get-AuthenticodeSignature -LiteralPath $name
              if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -cne 'Nathan McNulty') { throw "Publisher verification failed: $name" }
          }
          .\desktop-package-archive.ps1 -ArchivePath .\aiw-desktop.zip -ArchiveSha256 '{ARCHIVE_SHA}' -ReceiptSha256 '{RECEIPT_SHA}' -SourceRevision '{SOURCE}' -OutputDirectory 'C:\AIW-Desktop-Alpha-{SHORT_SOURCE}' -RequirePublisherSignature
          & 'C:\AIW-Desktop-Alpha-{SHORT_SOURCE}\aiw-desktop.exe'
          ```

          Do not check `$LASTEXITCODE` after the archive PowerShell script: it throws
          on failure. The destination must be fresh; do not overwrite prior evidence.
          Choose the fixed Notepad++ 8.9.8 x64 MSI assessment or interactive transfer,
          or Bambu Studio 02.08.02.60 x64 EXE export workflow in the GUI. Select the
          exact supported installer, review the recipe, approve its displayed literal,
          then press Start separately. Interactive transfer requires you to edit,
          save, and close the editor. Sandbox data is temporary; export required
          results explicitly. A passing function workflow does not prove broader
          isolation. Retain the result and cleanup record before closing the host GUI.

          To build a supported package, use **Build a Sandbox package**. Select
          **Supported application**: Notepad++ 8.9.8 x64 MSI or Bambu Studio
          2.8.2.60 x64 EXE. Choose the exact installer, **Analyze installer**, select
          **Windows Sandbox · offline and ephemeral** and a Notepad++ assessment/
          interactive workflow or **Fixed STL-to-3MF export** for Bambu, then
          **Create package**. Assembly does
          not run the installer. Retain the package folder and displayed manifest
          hash. Enter the operator identity below; interactive packages also need
          their own text input. Use **Prepare package validation**, review its recipe,
          approve the exact displayed literal, then **Start** separately. Interactive
          validation requires editing, saving and closing Notepad++; export the
          verified document explicitly to a new file. Only the installed fixed
          Notepad++ and Bambu recipes are supported. Fixed assessment and Bambu
          export complete automatically; inspect their function and cleanup results.
          Package assembly alone does not establish
          compatibility or broader isolation, and does not create an MSIX/AppContainer.
          '@
          $helperHash = (Get-FileHash (Join-Path $handoff 'desktop-package-archive.ps1') -Algorithm SHA256).Hash.ToLowerInvariant()
          $guide.Replace('{HELPER_SHA}', $helperHash).Replace('{VERIFIER_SHA}', $distribution.verifierSha256).Replace('{ARCHIVE_SHA}', $distribution.archive.sha256).Replace('{RECEIPT_SHA}', $assembled.receiptSha256).Replace('{SOURCE}', $env:SOURCE_REVISION).Replace('{SHORT_SOURCE}', $env:SOURCE_REVISION.Substring(0, 7)) | Set-Content (Join-Path $handoff 'START-HERE.md')
          $inventory = @(Get-ChildItem -LiteralPath $handoff -File | ForEach-Object { @{ name = $_.Name; sizeBytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } }) | ConvertTo-Json -Compress
          "inventory=$inventory" >> $env:GITHUB_OUTPUT
      - name: Retain candidate for independent download testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aiw-desktop-candidate-${{ github.sha }}
          path: ${{ runner.temp }}\desktop-handoff/
          if-no-files-found: error
          retention-days: 30

      - name: Retain signature and assembly records even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aiw-desktop-candidate-evidence-${{ github.sha }}
          path: ${{ runner.temp }}\signed-evidence/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: assemble
    if: inputs.publish && github.event.repository.private == false && github.repository == 'nathanmcnulty/app-isolation-workbench' && github.ref == 'refs/heads/main' && github.actor == 'nathanmcnulty'
    runs-on: windows-2025
    timeout-minutes: 15
    environment: public-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fetch only this run's assembled candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aiw-desktop-candidate-${{ github.sha }}
          path: release
      - name: Verify transferred handoff without executing payload or scripts
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
          INVENTORY: ${{ needs.assemble.outputs.handoff-inventory }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @('aiw-desktop.zip', 'desktop-package-archive.ps1', 'verify-desktop-package.ps1', 'distribution.json', 'START-HERE.md')
          $records = @($env:INVENTORY | ConvertFrom-Json)
          $actual = @(Get-ChildItem -LiteralPath release -Recurse -Force)
          if ($records.Count -ne 5 -or $actual.Count -ne 5 -or @($actual | Where-Object { $_.PSIsContainer -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) }).Count) { throw 'Unexpected public handoff inventory' }
          foreach ($name in $expected) {
            $record = @($records | Where-Object name -CEQ $name)
            $file = Get-Item -LiteralPath (Join-Path release $name)
            if ($record.Count -ne 1 -or $record[0].sha256 -notmatch '^[0-9a-f]{64}$' -or $file.Length -gt 512MB -or $record[0].sizeBytes -ne $file.Length -or $record[0].sha256 -cne (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Transferred public handoff bytes differ from assembly' }
          }
          $distribution = Get-Content release\distribution.json -Raw | ConvertFrom-Json
          if ($distribution.sourceRevision -cne $env:SOURCE_REVISION -or $distribution.archive.sha256 -cne ($records | Where-Object name -CEQ 'aiw-desktop.zip').sha256 -or $distribution.publisherSignaturesVerified -ne $true -or $distribution.authenticity -cne 'notEstablished') { throw 'Distribution record differs from the scoped candidate contract' }
      - name: Attest all five handoff files from this exact workflow revision
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}\release\*
      - name: Publish only the verified alpha assets and independent hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
          INVENTORY: ${{ needs.assemble.outputs.handoff-inventory }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'nathanmcnulty/app-isolation-workbench'
          $tag = 'desktop-alpha-' + $env:SOURCE_REVISION.Substring(0, 12)
          $records = @($env:INVENTORY | ConvertFrom-Json)
          $distribution = Get-Content release\distribution.json -Raw | ConvertFrom-Json
          $lines = @('# Signed desktop alpha', '', 'Windows Sandbox assessment for three fixed workflows: Notepad++ assessment, interactive document transfer, and Bambu Studio STL-to-3MF export. Includes installer analysis and reusable package assembly for all three fixed recipes, with separate review, approval and validation.', '', 'This is an alpha candidate. Exact downloaded-artifact runtime acceptance is pending. Supported function results remain separate from broader isolation, which is not established by signing or a passing workflow.', '', 'Download all five assets into one fresh folder and follow START-HERE.md. Windows Sandbox is required; application inputs are selected separately. Export needed results before discarding temporary Sandbox data.', '', "Source: $env:SOURCE_REVISION", "Build/sign/assembly run: $env:RUN_URL", "Build provenance attestation: $env:ATTESTATION_URL", "Package receipt SHA-256: $($distribution.receiptSha256)", '', '| File | SHA-256 |', '|---|---|')
          foreach ($record in $records) { $lines += "| $($record.name) | $($record.sha256) |" }
          $lines += @('', 'Authenticode verifies Nathan McNulty on the packaged executables and handoff scripts. GitHub build provenance binds each exact downloadable asset to this repository, workflow, and source revision; it is separate from application/isolation acceptance.', '', 'Advanced provenance verification:', '', '```powershell', "gh attestation verify .\aiw-desktop.zip --repo $repo --signer-workflow $repo/.github/workflows/desktop-candidate.yml --source-ref refs/heads/main --source-digest $env:SOURCE_REVISION --deny-self-hosted-runners", '```')
          $notes = Join-Path $env:RUNNER_TEMP 'alpha-release-notes.md'
          $lines -join "`n" | Set-Content -LiteralPath $notes
          $files = @($records | ForEach-Object { Join-Path release $_.name })
          $existingTags = gh api "repos/$repo/git/matching-refs/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($existingTags | Where-Object ref -CEQ "refs/tags/$tag").Count) { throw 'Candidate tag already exists or its absence could not be verified; refuse tag reuse' }
          gh release create $tag @files --repo $repo --target $env:SOURCE_REVISION --title ('App Isolation Workbench signed alpha ' + $env:SOURCE_REVISION.Substring(0, 7)) --draft --prerelease --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation/upload failed; preserve and inspect it rather than overwrite or recreate it' }
          # Drafts have no published tag lookup; resolve their numeric release ID.
          $releaseQuery = '.[] | select(.tag_name == "' + $tag + '") | .id'
          $releaseIds = @(gh api "repos/$repo/releases?per_page=100" --paginate --jq $releaseQuery)
          if ($LASTEXITCODE -ne 0 -or $releaseIds.Count -ne 1 -or $releaseIds[0] -notmatch '^\d+$') { throw 'Draft release identity is not unique; publication refused' }
          $release = gh api "repos/$repo/releases/$($releaseIds[0])" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -cne $tag -or -not $release.draft -or -not $release.prerelease -or $release.target_commitish -cne $env:SOURCE_REVISION -or @($release.assets).Count -ne 5) { throw 'Draft release identity differs; publication refused' }
          foreach ($record in $records) {
            $asset = @($release.assets | Where-Object name -CEQ $record.name)
            if ($asset.Count -ne 1 -or $asset[0].digest -cne ('sha256:' + $record.sha256) -or $asset[0].size -ne $record.sizeBytes) { throw 'Uploaded asset digest differs; leave release in draft' }
          }
          gh release edit $tag --repo $repo --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Alpha publication failed; inspect exact draft status before any retry' }
          $published = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or -not $published.prerelease -or @($published.assets).Count -ne 5) { throw 'Public alpha readback failed' }
          $tagCommit = gh api "repos/$repo/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:SOURCE_REVISION) { throw 'Published tag source identity differs' }
          foreach ($record in $records) {
            $asset = @($published.assets | Where-Object name -CEQ $record.name)
            if ($asset.Count -ne 1 -or $asset[0].digest -cne ('sha256:' + $record.sha256) -or $asset[0].size -ne $record.sizeBytes) { throw 'Published asset readback differs from assembly' }
          }
          $published.html_url >> $env:GITHUB_STEP_SUMMARY
