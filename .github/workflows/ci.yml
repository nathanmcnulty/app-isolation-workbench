          cargo +stable fmt --manifest-path gui/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Desktop formatting failed' }
          cargo +stable clippy --manifest-path gui/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Desktop clippy failed' }
          cargo +stable test --manifest-path gui/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop gate tests failed' }
          cargo +stable check --manifest-path gui/Cargo.toml --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release configuration failed' }
          node --test gui/tests/*.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop display controls failed' }
          .\scripts\test-desktop-package-verifier.ps1 -CheckSignedAssembly
      - name: Restore cargo-audit
        id: desktop-cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2
      - name: Install cargo-audit
        if: steps.desktop-cargo-audit-cache.outputs.cache-hit != 'true'
        shell: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          # AIW inline runtime assertion: independent of repository checkout.
          if ($PSVersionTable.PSEdition -cne 'Core' -or $PSVersionTable.PSVersion.ToString() -cne '7.6.7' -or $PSVersionTable.PSVersion.PreReleaseLabel -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -cne 'X64' -or [Diagnostics.Process]::GetCurrentProcess().MainModule.FileName -ine 'C:\Program Files\PowerShell\7\pwsh.exe' -or $PSHOME -ine 'C:\Program Files\PowerShell\7') { throw 'Expected exact stable machine PowerShell 7.6.7 x64' }
          foreach ($module in @('Microsoft.PowerShell.Management','Microsoft.PowerShell.Utility','Microsoft.PowerShell.Security','Microsoft.PowerShell.Archive')) { Import-Module (Join-Path $PSHOME ('Modules\'+$module+'\'+$module+'.psd1')) -SkipEditionCheck -ErrorAction Stop }
          $PSModuleAutoLoadingPreference = 'None'
          if (@(Get-PSSession | Where-Object Name -eq 'WinPSCompatSession').Count) { throw 'Compatibility session is prohibited' }
          $PSVersionTable | ConvertTo-Json -Depth 3 | Write-Host
          cargo +stable install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-audit installation failed' }
      - name: Audit desktop dependencies
        shell: '"C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          # AIW inline runtime assertion: independent of repository checkout.
          if ($PSVersionTable.PSEdition -cne 'Core' -or $PSVersionTable.PSVersion.ToString() -cne '7.6.7' -or $PSVersionTable.PSVersion.PreReleaseLabel -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -cne 'X64' -or [Diagnostics.Process]::GetCurrentProcess().MainModule.FileName -ine 'C:\Program Files\PowerShell\7\pwsh.exe' -or $PSHOME -ine 'C:\Program Files\PowerShell\7') { throw 'Expected exact stable machine PowerShell 7.6.7 x64' }
          foreach ($module in @('Microsoft.PowerShell.Management','Microsoft.PowerShell.Utility','Microsoft.PowerShell.Security','Microsoft.PowerShell.Archive')) { Import-Module (Join-Path $PSHOME ('Modules\'+$module+'\'+$module+'.psd1')) -SkipEditionCheck -ErrorAction Stop }
          $PSModuleAutoLoadingPreference = 'None'
          if (@(Get-PSSession | Where-Object Name -eq 'WinPSCompatSession').Count) { throw 'Compatibility session is prohibited' }
          $PSVersionTable | ConvertTo-Json -Depth 3 | Write-Host
          cargo +stable audit --file gui/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency audit failed' }
