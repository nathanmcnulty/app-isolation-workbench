name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify and audit
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Stable Rust installation failed' }
          rustup default stable

      - name: Restore cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Run repository verification
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        shell: pwsh
        run: .\scripts\audit-dependencies.ps1

      - name: Validate repository governance files
        shell: pwsh
        run: .\scripts\verify.ps1 -GovernanceOnly

  msrv:
    name: Minimum supported Rust
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check all targets with Rust 1.85
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust 1.85 installation failed' }
          cargo +1.85.0 check --workspace --all-targets --locked

  desktop:
    name: Windows desktop
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Stable Rust installation failed' }
      - name: Verify desktop source and gates
        shell: pwsh
        run: |
          cargo +stable fmt --manifest-path gui/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Desktop formatting failed' }
          cargo +stable clippy --manifest-path gui/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Desktop clippy failed' }
          cargo +stable test --manifest-path gui/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop gate tests failed' }
          node --test gui/tests/display.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop display controls failed' }
          .\scripts\test-desktop-package-verifier.ps1
      - name: Audit desktop dependencies
        shell: pwsh
        run: |
          cargo +stable install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-audit installation failed' }
          cargo +stable audit --file gui/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency audit failed' }
